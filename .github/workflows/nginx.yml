# anch-rest nginx module integration test: build nginx with the module and serve the test application
name: nginx

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGINX_VERSION: 1.30.6
  NGINX_SHA256: 3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8

jobs:
  nginx:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not instrumented: an ASan library can not be loaded by a non instrumented nginx
          - name: nginx module
            preset: debug
            cc_opt: ""
            ld_opt: ""
          # nginx and test application built with ThreadSanitizer: handler threads and event loop synchronization.
          # nginx core reports races on its own atomics (spinlocks, thread pool), not understood by ThreadSanitizer:
          # only reports with AnCH frames fail the job
          - name: nginx module (TSan)
            preset: tsan
            cc_opt: "-fsanitize=thread -O1 -g"
            ld_opt: "-fsanitize=thread"
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake pkgconf curl procps-ng

      - uses: actions/checkout@v7

      - name: Build test application
        run: |
          cmake --preset ${{ matrix.preset }} -DANCH_BUILD_REST=ON -DANCH_BUILD_SQL=OFF -DANCH_BUILD_CRYPTO=OFF -DANCH_BUILD_OAS=OFF
          cmake --build --preset ${{ matrix.preset }} --target anch-rest-nginx-test-app --parallel "$(nproc)"

      - name: Download nginx
        run: |
          mkdir -p /tmp/nginx
          cd /tmp/nginx
          curl -fsSLO "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          echo "${NGINX_SHA256}  nginx-${NGINX_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Test
        env:
          NGINX_CC_OPT: ${{ matrix.cc_opt }}
          NGINX_LD_OPT: ${{ matrix.ld_opt }}
          TSAN_OPTIONS: "halt_on_error=0:log_path=/tmp/tsan/report"
        run: |
          # nginx workers run as nobody (master started as root): ThreadSanitizer stops a process which can not
          # write its report
          mkdir -p /tmp/tsan
          chmod 1777 /tmp/tsan
          sh anch-rest/nginx/test/run-nginx-test.sh "/tmp/nginx/nginx-${NGINX_VERSION}" build/${{ matrix.preset }} /tmp/nginx-test

      - name: Check ThreadSanitizer reports
        if: matrix.preset == 'tsan'
        run: |
          ls /tmp/tsan/ 2> /dev/null || true
          if grep -l -E 'ngx_http_anch_rest|anch::' /tmp/tsan/report.* 2> /dev/null; then
            grep -h -B2 -A40 -E 'WARNING: ThreadSanitizer' /tmp/tsan/report.* | head -400
            echo "ThreadSanitizer reports with AnCH frames"
            exit 1
          fi
          echo "No ThreadSanitizer report with AnCH frames"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nginx-test-logs-${{ matrix.preset }}
          path: |
            /tmp/nginx-test/logs/
            /tmp/nginx-test.configure.log
            /tmp/nginx-test.make.log
            /tmp/tsan/
          if-no-files-found: ignore
