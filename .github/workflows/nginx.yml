# anch-rest nginx module integration test: build nginx with the module and serve the test application
name: nginx

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGINX_VERSION: 1.30.6
  NGINX_SHA256: 3cf46f5ed7504d460125866b7bea99fb357f31d887e2e63b35503310e9b8b6c8

jobs:
  nginx:
    name: nginx module
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Not instrumented: an ASan library can not be loaded by nginx
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake pkgconf curl

      - uses: actions/checkout@v4

      - name: Build test application
        run: |
          cmake --preset debug -DANCH_BUILD_REST=ON -DANCH_BUILD_SQL=OFF -DANCH_BUILD_CRYPTO=OFF -DANCH_BUILD_OAS=OFF
          cmake --build --preset debug --target anch-rest-nginx-test-app --parallel "$(nproc)"

      - name: Download nginx
        run: |
          mkdir -p /tmp/nginx
          cd /tmp/nginx
          curl -fsSLO "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          echo "${NGINX_SHA256}  nginx-${NGINX_VERSION}.tar.gz" | sha256sum -c -
          tar xzf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Test
        run: sh anch-rest/nginx/test/run-nginx-test.sh "/tmp/nginx/nginx-${NGINX_VERSION}" build/debug /tmp/nginx-test

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-test-logs
          path: |
            /tmp/nginx-test/logs/
            /tmp/nginx-test.configure.log
            /tmp/nginx-test.make.log
          if-no-files-found: ignore
